# Public deployment switches. Only the isolated container stack activates this profile;
# a plain local start never does, so local behaviour stays as it is.
# No secrets belong in this file.

# The key that encrypts MCP credentials users save; supplied by the launcher from the Keychain.
agent.mcp.credential-key-base64=${NEXUS_MCP_CREDENTIAL_KEY:}

# Registration needs an invite code issued with com.nexus.chat.tools.InviteCodeTool.
nexus.registration.invite-required=true
# The public stack holds no mail credentials, so it neither sends nor asks for email codes.
nexus.registration.email-code-required=false

# Model endpoints users enter may not point at this host, private networks or the tailnet.
# The Python agent enforces the same at connect time (MODEL_ENDPOINT_ALLOW_PRIVATE_NETWORK=false).
model.endpoint.allow-private-network=false

# A saved model key or MCP credential stays with the server it was entered for: changing the
# address of an entry without entering the secret again is refused (CredentialAddressPolicy).
nexus.credentials.bound-to-address=true

# A fully successful login gets a fresh session and revokes this account's older sessions.
# An enabled second factor is checked before any session/JWT is issued. No new login cooldown.
nexus.auth.single-session=true
nexus.auth.two-factor-login-required=true

# Per-account limits (see PublicQuotaInterceptor). Counters reset on restart.
nexus.quota.enabled=true
nexus.quota.upload-bytes-per-user-per-day=524288000
nexus.quota.storage-bytes=5368709120
nexus.quota.model-calls-per-user-per-day=200
nexus.quota.concurrent-model-calls-per-user=2
# Knowledge bases stay closed: ingestion parses uploaded documents with libraries that have
# open advisories (chromadb, unstructured), and this deployment has no embedding model anyway.
nexus.quota.knowledge-base-writable=false
# One request may carry at most this much; larger files go through chunked upload.
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=65MB

# Sign-in is refused for a while after repeated failures on one account.
nexus.auth.lockout.max-failures=8
nexus.auth.lockout.minutes=15

# Only relevant if email codes are switched back on: codes per address and in total per 24 hours.
verification.code.daily-limit-per-email=5
verification.code.daily-limit-global=200
