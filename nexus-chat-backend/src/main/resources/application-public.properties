# Public deployment switches. Only the isolated container stack activates this profile;
# a plain local start never does, so local behaviour stays as it is.
# No secrets belong in this file.

# Registration needs an invite code issued with com.nexus.chat.tools.InviteCodeTool.
nexus.registration.invite-required=true
# The public stack holds no mail credentials, so it neither sends nor asks for email codes.
nexus.registration.email-code-required=false

# Model endpoints users enter may not point at this host, private networks or the tailnet.
# The Python agent enforces the same at connect time (MODEL_ENDPOINT_ALLOW_PRIVATE_NETWORK=false).
model.endpoint.allow-private-network=false

# Sign-in is refused for a while after repeated failures on one account.
nexus.auth.lockout.max-failures=8
nexus.auth.lockout.minutes=15

# Only relevant if email codes are switched back on: codes per address and in total per 24 hours.
verification.code.daily-limit-per-email=5
verification.code.daily-limit-global=200
