# Application Configuration
spring.application.name=nexus-chat

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/nexus_chat?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# SSE / streaming endpoints (e.g. /agent/sessions/{id}/chat/stream) keep the
# request thread alive for many seconds. With OSIV on AND Hibernate's default
# DELAYED_ACQUISITION_AND_HOLD, the JDBC connection acquired by an early
# @Transactional call (touchAndAutoTitle) stays checked out of the Hikari pool
# until the request ends — well past leak-detection-threshold (15s) — and
# trips a "connection leak detected" warning. Releasing after each transaction
# returns the connection immediately while still letting OSIV serve any
# post-tx lazy reads.
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# JWT Configuration (30 days = 2592000000 ms)
jwt.secret=nexus-chat-secret-key-change-this-in-production-please-make-it-long-enough
jwt.expiration=2592000000

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# WebSocket Configuration
websocket.endpoint=/ws

# Logging
logging.level.com.nexus.chat=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# QQ Mail Configuration
spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=464394562@qq.com
spring.mail.password=irhkvupkgqiobjga
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.required=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory

# Verification Code Configuration
verification.code.expire-minutes=10
verification.code.resend-interval-seconds=60

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2000ms

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=15000

# WebRTC Configuration (reserved)
webrtc.stun.url=stun:stun.l.google.com:19302
webrtc.turn.url=
webrtc.turn.username=
webrtc.turn.credential=

# Companion API key encryption secret (change in production)
companion.api-key.secret=change-me-in-production

# Companion asset storage (local dev defaults)
companion.assets.root=../nexus-chat-frontend/public
companion.assets.models-dir=${companion.assets.root}/models
companion.assets.motions-dir=${companion.assets.root}/motions
companion.assets.motions-config=${companion.assets.motions-dir}/motions.json

# ===== Agent Gateway =====
# Python agent backend base URL
agent.python.base-url=${AGENT_PYTHON_BASE_URL:http://localhost:8100}
# Shared secret for Python -> Java internal calls (Bearer token)
agent.internal.token=${AGENT_INTERNAL_TOKEN:dev-internal-token-change-me}
# HMAC secret for Java -> Python signature header
agent.internal.signing-secret=${AGENT_INTERNAL_SIGNING_SECRET:dev-signing-secret-change-me}
# Outbound request timeouts (ms)
agent.python.connect-timeout-ms=3000
agent.python.read-timeout-ms=30000
