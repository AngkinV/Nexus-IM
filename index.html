<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>春信·远岫</title>
<style>
:root{--ink:#E9E4D4;--line:rgba(233,228,212,.2);--seal:#D1503A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0A0D12}
body{transition:background .9s}
body.su{--ink:#1E242B;--line:rgba(30,36,43,.24);--seal:#B23A2A;background:#EAE4D7}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair;outline:none}
body.tavern #c{cursor:default}
#colophon{position:fixed;top:6vh;right:5.5vw;display:flex;flex-direction:column;align-items:center;gap:1.4vh;color:var(--ink);pointer-events:none;user-select:none;transition:opacity .5s,color .9s}
#colophon h1{margin:0;writing-mode:vertical-rl;font:400 clamp(15px,3.1vh,30px)/1 "Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;letter-spacing:.32em}
#colophon svg{width:clamp(22px,4.3vh,42px);height:auto;display:block}
#bar{position:fixed;left:6vw;right:6vw;bottom:max(3.2vh,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:clamp(6px,2vw,26px);padding-top:6px;transition:opacity .45s,border-color .9s}
#bar button{appearance:none;background:none;border:0;padding:8px 6px;color:var(--ink);opacity:.6;cursor:pointer;font:400 13px/1 "Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;letter-spacing:.2em;transition:opacity .2s,color .9s}
#bar button:hover{opacity:1}
#bar button:focus-visible{opacity:1;outline:1px solid var(--ink);outline-offset:2px}
body.transit #colophon,body.tavern #colophon{opacity:0}
body.transit #bar{opacity:0;pointer-events:none}
body.tavern #bFlow{display:none}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="春信·远岫：可横向拖动的远景山水长卷"></canvas>
<div id="colophon">
  <h1>春信·远岫</h1>
  <svg viewBox="0 0 40 40" aria-hidden="true">
    <defs><filter id="worn" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/></filter></defs>
    <g filter="url(#worn)">
      <rect x="3" y="3" width="34" height="34" rx="2.5" style="fill:none;stroke:var(--seal);stroke-width:1.7"/>
      <text x="20" y="18.2" text-anchor="middle" font-size="14" font-family="Songti SC,STSong,SimSun,serif" style="fill:var(--seal)">春</text>
      <text x="20" y="33.2" text-anchor="middle" font-size="14" font-family="Songti SC,STSong,SimSun,serif" style="fill:var(--seal)">信</text>
    </g>
  </svg>
</div>
<nav id="bar">
  <button id="bTone" type="button">玄墨 / 素绢</button>
  <button id="bFlow" type="button">流彩</button>
  <button id="bGo" type="button">进入酒馆</button>
</nav>
<script>
const SpringLanding = (() => {
  const SERIF = '"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong","SimSun",serif';
  const SANS = '"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif';

  // 每组颜色为 [暗, 亮]
  const PAPER = [[10, 13, 18], [234, 228, 215]];
  const SURFACE = [[19, 27, 36], [220, 211, 193]];
  const INK = [[219, 212, 198], [30, 37, 45]];
  const GLINT = [[150, 170, 188], [250, 246, 236]];
  const SEAL = [[186, 108, 84], [158, 72, 52]];

  // 分隔线下缘的断续高光：[起点, 终点]，占宽度比例
  const HIGHLIGHTS = [[0.05, 0.21], [0.26, 0.47], [0.5, 0.58], [0.63, 0.86], [0.9, 0.97]];
  // 线下的几笔枯笔反光：[x 比例, 下移 px, 长度比例, 浓度]
  const RIPPLES = [[0.18, 6, 0.09, 0.5], [0.47, 9, 0.13, 0.8], [0.39, 15, 0.05, 0.45], [0.71, 7, 0.07, 0.55], [0.58, 21, 0.03, 0.3]];

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const smooth = (a, b, v) => {
    const t = clamp((v - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const lerp3 = (a, b, t) => a.map((c, i) => c + (b[i] - c) * t);
  const css = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
  // 按绝对像素取相位：均值为 0，线始终落在 H*.75，缩放窗口时笔迹不游走
  const wobble = (x) => 0.55 * Math.sin(x * 0.013 + 0.9) + 0.3 * Math.sin(x * 0.041 + 2.1);

  // 逐字排，不依赖 ctx.letterSpacing 的浏览器支持；anchor 0 左对齐、0.5 居中，返回总宽
  const tracked = (ctx, text, x, y, gap, anchor) => {
    const chars = Array.from(text);
    const widths = chars.map((c) => ctx.measureText(c).width);
    const total = widths.reduce((s, v) => s + v, 0) + gap * (chars.length - 1);
    chars.reduce((cx, c, i) => {
      ctx.fillText(c, cx, y);
      return cx + widths[i] + gap;
    }, x - total * anchor);
    return total;
  };

  const draw = (ctx, w, h, lightMix, reveal) => {
    const L = clamp(lightMix, 0, 1);
    const R = clamp(reveal, 0, 1);
    // 底色线性过渡，墨色在中段快速换相：线性混合会让文字在 0.3–0.7 整段贴近底色
    const ink = lerp3(INK[0], INK[1], smooth(0.44, 0.56, L));
    const paper = lerp3(PAPER[0], PAPER[1], L);
    const surface = lerp3(SURFACE[0], SURFACE[1], L);
    const glint = lerp3(GLINT[0], GLINT[1], L);
    const seal = lerp3(SEAL[0], SEAL[1], L);
    const y0 = h * 0.75;
    const m = clamp(Math.min(w, h) * 0.07, 20, 72);

    ctx.save();

    // 全部透明度写进颜色，不动 globalAlpha / 合成模式，调用方的设置保持有效
    const bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, css(paper, 1));
    bg.addColorStop(0.75, css(lerp3(paper, surface, 0.45), 1));
    bg.addColorStop(0.75, css(lerp3(paper, surface, 0.7), 1));
    bg.addColorStop(1, css(surface, 1));
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    const haze = ctx.createRadialGradient(w * 0.46, y0, 0, w * 0.46, y0, Math.max(w, h) * 0.6);
    haze.addColorStop(0, css(glint, 0.05 + 0.2 * L));
    haze.addColorStop(1, css(glint, 0));
    ctx.fillStyle = haze;
    ctx.fillRect(0, 0, w, h);

    // 锚线在 reveal=0 时就可见：缝刚开时它是唯一露出的东西
    const la = 0.62 + 0.38 * smooth(0, 0.5, R);
    ctx.lineWidth = 1;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const edge = ctx.createLinearGradient(0, 0, w, 0);
    edge.addColorStop(0, css(ink, 0.08 * la));
    edge.addColorStop(0.3, css(ink, 0.22 * la));
    edge.addColorStop(0.42, css(ink, 0.3 * la));
    edge.addColorStop(0.62, css(ink, 0.2 * la));
    edge.addColorStop(1, css(ink, 0.08 * la));
    ctx.strokeStyle = edge;
    ctx.beginPath();
    ctx.moveTo(0, y0 + wobble(0));
    for (let x = 16; x < w + 16; x += 16) ctx.lineTo(x, y0 + wobble(x));
    ctx.stroke();

    ctx.strokeStyle = css(glint, (0.14 + 0.4 * L) * la);
    ctx.beginPath();
    HIGHLIGHTS.forEach((seg) => {
      ctx.moveTo(seg[0] * w, y0 + 1.25 + wobble(seg[0] * w));
      for (let x = seg[0] * w + 16; x < seg[1] * w; x += 16) ctx.lineTo(x, y0 + 1.25 + wobble(x));
      ctx.lineTo(seg[1] * w, y0 + 1.25 + wobble(seg[1] * w));
    });
    ctx.stroke();

    RIPPLES.forEach((r) => {
      ctx.strokeStyle = css(ink, 0.11 * r[3] * la);
      ctx.beginPath();
      ctx.moveTo(r[0] * w, y0 + r[1]);
      ctx.quadraticCurveTo((r[0] + r[2] * 0.5) * w, y0 + r[1] + 0.9, (r[0] + r[2]) * w, y0 + r[1] + 0.2);
      ctx.stroke();
    });

    // 页眉：酒馆 | 角色会话
    const e1 = smooth(0.1, 0.7, R);
    const fs1 = clamp(Math.min(w, h) * 0.026, 15, 18);
    const fs2 = clamp(fs1 * 0.68, 11, 12);
    const hy = m + 8;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.font = `400 ${fs1}px ${SERIF}`;
    ctx.fillStyle = css(ink, 0.86 * e1);
    const sepX = Math.round(m + tracked(ctx, '酒馆', m, hy, fs1 * 0.16, 0) + 12) + 0.5;
    ctx.strokeStyle = css(ink, 0.28 * e1);
    ctx.beginPath();
    ctx.moveTo(sepX, hy - 6);
    ctx.lineTo(sepX, hy + 6);
    ctx.stroke();
    ctx.font = `400 ${fs2}px ${SANS}`;
    ctx.fillStyle = css(ink, 0.58 * e1);
    tracked(ctx, '角色会话', sepX + 12, hy, fs2 * 0.22, 0);

    const headBottom = Math.round(hy + fs1 * 0.5 + 14) + 0.5;
    const rule = ctx.createLinearGradient(m, 0, w - m, 0);
    rule.addColorStop(0, css(ink, 0.16 * e1));
    rule.addColorStop(1, css(ink, 0));
    ctx.strokeStyle = rule;
    ctx.beginPath();
    ctx.moveTo(m, headBottom);
    ctx.lineTo(w - m, headBottom);
    ctx.stroke();

    // 空状态：整组居中在页眉与锚线之间，不进入下方四分之一
    const e2 = smooth(0.25, 0.9, R);
    const e3 = smooth(0.45, 1, R);
    const avail = y0 - headBottom;
    const fsT = clamp(Math.min(w * 0.06, avail * 0.11), 18, 30);
    const fsC = clamp(fsT * 0.4, 11, 12.5);
    const s = avail < 190 ? 0 : fsT * 0.78;
    const sealBlock = s && s + fsT * 0.95;
    const cx = w / 2;
    const top = headBottom + avail * 0.48 - (sealBlock + fsT * 2.45 + fsC) / 2 + (1 - e2) * 6;

    if (s) {
      const sx = cx - s / 2;
      // 四角各偏一点，取刻印边框的不规整
      ctx.beginPath();
      ctx.moveTo(sx + s * 0.5, top);
      ctx.arcTo(sx + s, top + 0.6, sx + s - 0.5, top + s, s * 0.14);
      ctx.arcTo(sx + s - 0.5, top + s, sx, top + s - 0.4, s * 0.14);
      ctx.arcTo(sx, top + s - 0.4, sx + 0.3, top, s * 0.14);
      ctx.arcTo(sx + 0.3, top, sx + s * 0.5, top, s * 0.14);
      ctx.closePath();
      ctx.fillStyle = css(seal, 0.07 * e2);
      ctx.fill();
      ctx.strokeStyle = css(seal, 0.78 * e2);
      ctx.stroke();
      // 印内一道断线，同样落在四分之三高处，呼应画面的水线
      ctx.beginPath();
      ctx.moveTo(sx + s * 0.22, top + s * 0.75);
      ctx.lineTo(sx + s * 0.58, top + s * 0.75);
      ctx.moveTo(sx + s * 0.68, top + s * 0.75);
      ctx.lineTo(sx + s * 0.8, top + s * 0.75);
      ctx.stroke();
    }

    const titleY = top + sealBlock + fsT * 0.5;
    ctx.font = `400 ${fsT}px ${SERIF}`;
    ctx.fillStyle = css(ink, 0.9 * e2);
    tracked(ctx, '尚未选择角色', cx, titleY, fsT * 0.18, 0.5);

    const ruleY = Math.round(titleY + fsT * 1.35) + 0.5;
    ctx.strokeStyle = css(ink, 0.3 * e3);
    ctx.beginPath();
    ctx.moveTo(cx - fsT * 0.5, ruleY);
    ctx.lineTo(cx + fsT * 0.5, ruleY);
    ctx.stroke();

    ctx.font = `400 ${fsC}px ${SANS}`;
    ctx.fillStyle = css(ink, 0.64 * e3);
    tracked(ctx, '转场预览 · 未连接会话', cx, ruleY + fsT * 0.6 + fsC * 0.5, fsC * 0.2, 0.5);

    ctx.restore();
  };

  return { draw };
})();
(() => {
'use strict';
// ───────────────────────── 基础工具 ─────────────────────────
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mod = (a, n) => ((a % n) + n) % n;
const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function mulberry32(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function h2(x, y) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; }
const GX = [1, -1, 1, -1, 1, -1, 0, 0], GY = [1, 1, -1, -1, 0, 0, 1, -1];
// 梯度噪声，x 方向以整数 px 为周期，长卷首尾因此无缝
function pn(x, y, px) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const x0 = ((xi % px) + px) % px, x1 = x0 + 1 === px ? 0 : x0 + 1, y1 = yi + 1;
  const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10), v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
  const a = h2(x0, yi) & 7, b = h2(x1, yi) & 7, c = h2(x0, y1) & 7, d = h2(x1, y1) & 7;
  const n00 = GX[a] * xf + GY[a] * yf, n10 = GX[b] * (xf - 1) + GY[b] * yf;
  const n01 = GX[c] * xf + GY[c] * (yf - 1), n11 = GX[d] * (xf - 1) + GY[d] * (yf - 1);
  const nx0 = n00 + (n10 - n00) * u, nx1 = n01 + (n11 - n01) * u;
  return nx0 + (nx1 - nx0) * v;
}

// ───────────────────────── 配色 ─────────────────────────
const PAL = [{ // 玄墨·暗春
  sky0: '#0A0D12', sky1: '#10171F', sky2: '#131B24',
  glow: ['rgba(244,247,245,.085)', 'rgba(244,211,94,.07)'], glow0: ['rgba(244,247,245,0)', 'rgba(244,211,94,0)'],
  water: [11, 17, 24], mist: [205, 219, 224], mistA: .27,
  ink: '5,7,10', cunS: '142,184,190', gold: '244,211,94', goldA: .85, dots: ['5,7,10', '82,183,136', '255,143,163'],
  seamL: '255,226,130', seamC: '255,246,214', vig: '2,4,8', vigA: .5, tint: 'rgba(19,34,52,.07)', hair: '244,247,245', shoreA: .42,
  g0: hex('#1E5C50'), g1: hex('#52B788'), G1: hex('#74C69D'), Gd: hex('#17463F'), P1: hex('#F26D85'), P2: hex('#FF8FA3'),
  Y1: hex('#F4D35E'), Y2: hex('#FFE17D'), Wt: hex('#F4F7F5'), sh0: hex('#0D2331'), sh1: hex('#1B414D'),
  paper: hex('#131B24'), haze: hex('#16232E'), far0: hex('#1A2A36'), far1: hex('#294350')
}, { // 素绢·明春
  sky0: '#EAE4D7', sky1: '#E2DBCB', sky2: '#DCD3C1',
  glow: ['rgba(250,248,245,.55)', 'rgba(233,196,106,.16)'], glow0: ['rgba(250,248,245,0)', 'rgba(233,196,106,0)'],
  water: [199, 202, 188], mist: [250, 248, 245], mistA: .8,
  ink: '30,36,43', cunS: '30,36,43', gold: '196,150,62', goldA: .35, dots: ['30,36,43', '64,145,108', '227,93,117'],
  seamL: '226,178,84', seamC: '176,120,40', vig: '92,74,50', vigA: .24, tint: 'rgba(214,190,150,.06)', hair: '250,248,245', shoreA: .9,
  g0: hex('#40916C'), g1: hex('#74C69D'), G1: hex('#A9DBBF'), Gd: hex('#2E6E58'), P1: hex('#E35D75'), P2: hex('#F598A8'),
  Y1: hex('#E9C46A'), Y2: hex('#F4D35E'), Wt: hex('#FAF8F5'), sh0: hex('#55767A'), sh1: hex('#7C9A96'),
  paper: hex('#EAE4D7'), haze: hex('#DDD7C8'), far0: hex('#BFC3B6'), far1: hex('#A9B6AC')
}];
for (const p of PAL) { const mx3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; p.rim = mx3(p.Wt, p.Y2, .35); p.pale = mx3(p.P2, p.Wt, .4); p.cream = mx3(p.Y2, p.Wt, .3); }

// ───────────────────────── 山势（逻辑坐标：一卷 1536 × 320，y=320 为水岸） ─────────────────────────
const U = 1536, RN = U * 2, LH = 320;
const LAY = [
  { k: 0, far: true, par: .15, F: .22, P: 5, seed: 3.1, hi: 58, lo: 230, gam: 1.4, eps: .05, oct: 4, skew: .45, alpha: .62, fade0: 150, fade1: 266, lineW: .55 },
  { k: 1, par: .40, F: .5, P: 3, seed: 8.7, hi: 20, lo: 238, gam: 1.35, eps: .035, oct: 6, skew: .6, alpha: .97, fade0: 214, fade1: 302, PA: 11, slant: .32, fy: 230, rimD: 9, lineW: 1, haze: .1, fk: 110, minCh: 12 },
  { k: 2, par: .60, F: .74, P: 4, seed: 15.3, hi: 98, lo: 268, gam: 1.2, eps: .035, oct: 6, skew: -.55, alpha: .97, fade0: 252, fade1: 316, PA: 13, slant: -.26, fy: 200, rimD: 8, lineW: 1, haze: .05, fk: 110, minCh: 10 },
  { k: 3, par: .80, F: 1, P: 6, seed: 23.9, hi: 184, lo: 300, gam: 1.1, eps: .045, oct: 5, skew: .5, alpha: .95, fade0: 286, fade1: 322, PA: 16, slant: .3, fy: 150, rimD: 6, lineW: .95, haze: 0, fk: 110, minCh: 7 }
];
const MIST = [
  { mist: true, y0: 148, h: 80, F: .34, par: .25, sp: 2.2, seed: 2.1, am: 1, amp: [9, 6, 3], k: 2, bias: .02, th: 58 },
  { mist: true, y0: 204, h: 72, F: .62, par: .5, sp: -1.5, seed: 6.4, am: .9, amp: [8, 5, 3], k: 3, bias: -.05, th: 52 },
  { mist: true, y0: 262, h: 56, F: .86, par: .7, sp: 1.1, seed: 9.9, am: .8, amp: [6, 4, 2], k: 2, bias: .08, th: 40 }
];
const STACK = [LAY[0], MIST[0], LAY[1], MIST[1], LAY[2], MIST[2], LAY[3]];
for (const it of STACK) { it.atlas = [null, null]; it.t0 = 0; }

// 脊状分形（Ridged Multifractal）+ 山群包络 + 偏斜扭曲：主峰、余脉、缓坡不对称
function buildRidge(L) {
  const raw = new Float32Array(RN); let mn = 1e9, mx = -1e9;
  for (let i = 0; i < RN; i++) {
    const x = i / RN;
    const sk = x + L.skew * Math.sin(TAU * (L.P * x + L.seed)) / (TAU * L.P) + .012 * pn(x * 6, L.seed + 3.7, 6);
    const e0 = pn(x * 3 + L.seed, L.seed * 1.31 + .5, 3) * 1.15 + pn(x * 7, L.seed * 2.17 + 9.5, 7) * .5;
    const E = ss(-.38, .42, e0);
    let f = L.P, a = 1, w = 1, sum = 0, nrm = 0;
    for (let o = 0; o < L.oct; o++) {
      const n = pn(sk * f, L.seed * 5.3 + o * 13.7, f) * 1.9;
      let r = 1 - Math.sqrt(n * n + L.eps); if (r < 0) r = 0;
      r = Math.pow(r, 1.5) * w; w = clamp(r * 1.8, 0, 1); sum += r * a; nrm += a; a *= .5; f *= 2;
    }
    const v = E * (.2 + .8 * sum / nrm) + .1 * pn(x * 5, L.seed + 41.5, 5) + .05 * E;
    raw[i] = v; if (v < mn) mn = v; if (v > mx) mx = v;
  }
  const R = new Float32Array(RN);
  for (let i = 0; i < RN; i++) R[i] = L.lo - (L.lo - L.hi) * Math.pow(clamp((raw[i] - mn) / (mx - mn), 0, 1), L.gam);

  waves = waves.filter((w) => t - w.t0 < 1.5); rings = rings.filter((r) => t - r.t0 < .75); cuts = cuts.filter((c) => t - c.t0 < .75);
  const tr = trans(tau), fade = reduced ? ss(0, TT, tau) : 0;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';

  if (mode !== 'tavern') {
    const bands = [];
    for (const w of waves) { const age = Math.max(0, t - w.t0), k = Math.pow(1 - age / 1.5, 1.6) * Math.min(1, age / .06), d = Math.max(Wpx * .62, 700 * dpr) * age; bands.push({ c: w.x - d, hw: 140 * dpr, k }, { c: w.x + d, hw: 140 * dpr, k }); }
    if (tr.on && tr.conv < 1) { const e = .5 - .5 * Math.cos(Math.PI * tr.conv), k = Math.pow(Math.sin(Math.PI * tr.conv), .8); bands.push({ c: Wpx * (-.08 + .58 * e), hw: 120 * dpr, k }, { c: Wpx * (1.08 - .58 * e), hw: 120 * dpr, k }); }
    if (mix <= 0 || mix >= 1) renderUp(upx, mix >= 1 ? 1 : 0, tr, t, now, bands);
    else { renderUp(upx, 0, tr, t, now, bands); renderUp(upBx, 1, tr, t, now, bands); upx.globalAlpha = em; upx.drawImage(upB, 0, 0); upx.globalAlpha = 1; }
  }
  const P = PAL[em < .5 ? 0 : 1], dark = em < .5;
  if (tr.open || mode === 'tavern') {
    // 酒馆一侧：镜头略微前压后落稳，锚线始终停在原来水岸的高度
    const ls = 1 + .045 * (1 - (mode === 'tavern' ? 1 : tr.settle)), s = dpr * ls;
    g.setTransform(s, 0, 0, s, dpr * W / 2 * (1 - ls), dpr * H * .75 * (1 - ls));
    SpringLanding.draw(g, W, H, em, mode === 'tavern' ? 1 : tr.reveal);
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    if (tr.light > 0 && mode !== 'tavern') { // 缝里透出来的灯色
      const hb = Hpx * .1, gr = g.createLinearGradient(0, waterY - hb, 0, waterY + hb), pk = (dark ? .3 : .34) * tr.light;
      gr.addColorStop(0, `rgba(${P.seamL},0)`); gr.addColorStop(.38, `rgba(${P.seamL},${pk * .3})`); gr.addColorStop(.5, `rgba(${P.seamL},${pk})`); gr.addColorStop(.62, `rgba(${P.seamL},${pk * .3})`); gr.addColorStop(1, `rgba(${P.seamL},0)`);
      g.globalCompositeOperation = dark ? 'lighter' : 'source-over'; g.fillStyle = gr; g.fillRect(0, waterY - hb, Wpx, hb * 2); g.globalCompositeOperation = 'source-over';
    }
  }
  if (mode !== 'tavern') {
    const top = waterY - tr.up, bot = waterY + tr.dn;
    if (top > 0) { if (tr.zu > 1) { const w = Wpx * tr.zu, h = waterY * tr.zu; g.drawImage(up, (Wpx - w) / 2, top - h, w, h); } else g.drawImage(up, 0, top - waterY); }
    drawWater(tr.dn, t, tr.calm, em);
    for (const r of rings) { // 落点的一圈无声波纹
      const age = clamp((t - r.t0) / .75, 0, 1), e = 1 - Math.pow(1 - age, 3);
      g.globalAlpha = Math.pow(1 - age, 2) * .7; g.strokeStyle = `rgb(${dark ? '255,240,198' : P.seamC})`; g.lineWidth = Math.max(1, dpr * .9);
      g.beginPath(); g.ellipse(r.x, r.y, (12 + 150 * e) * dpr, (5 + 46 * e) * dpr, 0, 0, TAU); g.stroke();
    }
    g.globalAlpha = 1;
    if (tr.on) {
      if (tr.light > 0 && tr.open) { // 灯色漫上山脚与水面
        g.globalCompositeOperation = dark ? 'lighter' : 'source-over';
        let hh = Hpx * .17, gr = g.createLinearGradient(0, top, 0, top - hh); gr.addColorStop(0, `rgba(${P.seamL},${.24 * tr.light})`); gr.addColorStop(.35, `rgba(${P.seamL},${.07 * tr.light})`); gr.addColorStop(1, `rgba(${P.seamL},0)`);
        g.fillStyle = gr; g.fillRect(0, top - hh, Wpx, hh);
        hh = Hpx * .1; gr = g.createLinearGradient(0, bot, 0, bot + hh); gr.addColorStop(0, `rgba(${P.seamL},${.2 * tr.light})`); gr.addColorStop(1, `rgba(${P.seamL},0)`);
        g.fillStyle = gr; g.fillRect(0, bot, Wpx, hh); g.globalCompositeOperation = 'source-over';
      }
      if (tr.edge > 0) { // 水岸线点亮，随后一分为二成为裂口的两道边
        const half = Wpx * .56 * tr.ign, cx = Wpx / 2, mkG = (rgb, a) => { const gr = g.createLinearGradient(cx - half, 0, cx + half, 0); gr.addColorStop(0, `rgba(${rgb},0)`); gr.addColorStop(.14, `rgba(${rgb},${a})`); gr.addColorStop(.86, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`); return gr; };
        const soft = mkG(P.seamL, .18 * tr.edge), core = mkG(P.seamC, .95 * tr.edge);
        for (const yy of tr.open ? [top, bot] : [waterY]) { thread(yy, half, 3.2 * dpr, soft); thread(yy, half, 1.1 * dpr, core); }
      }
    }
    if (fade > 0) { g.globalAlpha = fade; g.setTransform(dpr, 0, 0, dpr, 0, 0); SpringLanding.draw(g, W, H, em, fade); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; }
  }
  // 绢纹与统一的空气色
  for (let th = 0; th < 2; th++) {
    const a = th ? em : 1 - em; if (a <= 0 || !silk[th]) continue;
    g.globalCompositeOperation = th ? 'multiply' : 'soft-light'; g.globalAlpha = a * (th ? .62 : .5); g.fillStyle = silk[th]; g.fillRect(0, 0, Wpx, Hpx);
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = a; g.fillStyle = PAL[th].tint; g.fillRect(0, 0, Wpx, Hpx);
    const dg = Math.hypot(Wpx, Hpx), vg = g.createRadialGradient(Wpx / 2, Hpx * .46, dg * .3, Wpx / 2, Hpx * .46, dg * .68);
    vg.addColorStop(0, `rgba(${PAL[th].vig},0)`); vg.addColorStop(1, `rgba(${PAL[th].vig},${PAL[th].vigA})`); g.fillStyle = vg; g.fillRect(0, 0, Wpx, Hpx);
  }
  g.globalAlpha = 1;
}

// ───────────────────────── 交互 ─────────────────────────
function flow(xp, yp) { const t = last; waves.push({ x: xp, t0: t }); rings.push({ x: xp, y: yp, t0: t }); }
function enter() { if (mode === 'scroll') { mode = 'entering'; tau = Math.max(tau, .0001); cam.v = 0; } else if (mode === 'leaving') mode = 'entering'; syncUI(); }
function leave() { if (mode === 'tavern' || mode === 'entering') { mode = 'leaving'; hold = false; } syncUI(); }
cv.addEventListener('pointerdown', (e) => {
  if (mode !== 'scroll') return;
  drag.on = true; drag.id = e.pointerId; drag.x0 = drag.lx = e.clientX; drag.y0 = e.clientY; drag.lt = performance.now(); drag.moved = 0; cam.v = 0;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', (e) => {
  if (mode !== 'scroll') return;
  if (drag.on && e.pointerId === drag.id) {
    const now = performance.now(), dx = e.clientX - drag.lx, dtm = Math.max(1, now - drag.lt);
    cam.x -= dx; cam.v = lerp(cam.v, -dx / dtm * 1000, .5); drag.lx = e.clientX; drag.lt = now; drag.moved += Math.abs(dx);
    return;
  }
  const xp = e.clientX * dpr, yp = e.clientY * dpr;
  if (cur.e < .02) { cur.x = xp; cur.y = yp; }
  cur.tx = xp; cur.ty = yp; cur.e = Math.min(1, cur.e + .34);
  if (yp > waterY + 4 * dpr && Math.hypot(xp - cur.lx, yp - cur.ly) > 46 * dpr) { cuts.push({ x: xp, y: yp, t0: last }); cur.lx = xp; cur.ly = yp; if (cuts.length > 8) cuts.shift(); }
});
const endDrag = (e) => {
  if (!drag.on || e.pointerId !== drag.id) return;
  drag.on = false;
  if (performance.now() - drag.lt > 90) cam.v = 0;
  if (e.type === 'pointerup' && drag.moved < 6 && Math.abs(e.clientY - drag.y0) < 6) { cam.v = 0; flow(e.clientX * dpr, e.clientY * dpr); }
};
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('pointerleave', () => { cur.tx = cur.x; cur.ty = cur.y; });
cv.addEventListener('wheel', (e) => { e.preventDefault(); if (mode !== 'scroll') return; const d = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * (e.deltaMode === 1 ? 32 : 1); cam.v = clamp(cam.v + d * 7, -4200, 4200); }, { passive: false });
bTone.addEventListener('click', () => { themeTarget = themeTarget ? 0 : 1; syncUI(); });
bFlow.addEventListener('click', () => { if (mode === 'scroll') flow(Wpx * (.3 + .4 * Math.random()), Hpx * .56); });
bGo.addEventListener('click', () => (mode === 'tavern' ? leave() : enter()));
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') leave();
  else if (mode === 'scroll' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) cam.v = clamp(cam.v + (e.key === 'ArrowRight' ? 520 : -520), -4200, 4200);
});
let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(resize, 120); });

// 定格：#t=1.1 把转场停在第 1.1 秒，#su 用素绢底，#x=300 指定卷轴位置，便于逐帧看
const hash = location.hash, ht = /t=([\d.]+)/.exec(hash), hx = /x=(-?\d+)/.exec(hash);
if (/su/.test(hash)) { themeTarget = 1; mix = 1; }
if (hx) cam.x = +hx[1];
if (ht) { hold = true; tau = clamp(+ht[1], 0, TT); mode = tau >= TT ? 'tavern' : tau > 0 ? 'entering' : 'scroll'; if (mode === 'tavern') hold = false; }
makeSilk(); resize(); syncUI();
SpringLanding.draw(mk(8, 8).getContext('2d'), 1280, 800, 0, 1); SpringLanding.draw(mk(8, 8).getContext('2d'), 1280, 800, 1, 1);
requestAnimationFrame(frame);
})();
</script>
