<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    @media (prefers-color-scheme: light) {
      .nexus-fg { fill: #000000; }
      .nexus-mid { fill: #475569; }
    }
    @media (prefers-color-scheme: dark) {
      .nexus-fg { fill: #FFFFFF; }
      .nexus-mid { fill: #CBD5E1; }
    }
  </style>
  <!-- 左柱 -->
  <path class="nexus-fg" d="M 6 26 L 6 8 C 6 6.9 6.9 6 8 6 L 11 6 C 12.1 6 13 6.9 13 8 L 13 26 Z"/>
  <!-- 右柱 -->
  <path class="nexus-mid" d="M 19 6 L 24 6 C 25.1 6 26 6.9 26 8 L 26 24 C 26 25.1 25.1 26 24 26 L 19 26 Z"/>
  <!-- 对角主切带 -->
  <path class="nexus-fg" d="M 7 7 L 13 7 L 25 25 L 19 25 Z"/>
  <!-- 交叉节点与核心奇点 -->
  <circle class="nexus-fg" cx="16" cy="16" r="3.2"/>
  <circle cx="16" cy="16" r="1.3" fill="#090A0D"/>
</svg>
