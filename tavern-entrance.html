<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>酒馆入场转场 · 原型</title>
<style>
:root{--bg:#0d0f12;--panel:#14171b;--line:rgba(255,255,255,.09);--blk:rgba(255,255,255,.07);--blk2:rgba(255,255,255,.13);--ink:#d9d9d6;--mut:rgba(217,217,214,.55)}
body.su{--bg:#f1f0ed;--panel:#e8e7e3;--line:rgba(0,0,0,.11);--blk:rgba(0,0,0,.07);--blk2:rgba(0,0,0,.14);--ink:#1e2226;--mut:rgba(30,34,38,.6)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:13px/1.4 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
.screen{position:fixed;inset:0;display:grid;grid-template-columns:56px 272px minmax(0,1fr);grid-template-rows:48px minmax(0,1fr);background:var(--bg)}
#after{display:none;grid-template-columns:56px minmax(0,1fr);grid-template-rows:56px 40vh minmax(0,1fr) 72px}
body.in #before{display:none}
body.in #after{display:grid}
.rail{grid-row:1/-1;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0}
.rail i{width:34px;height:34px;border-radius:9px;background:var(--blk)}
.rail i.on{background:var(--blk2)}
#go{appearance:none;width:46px;padding:7px 0 5px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:11px}
#go:hover{background:var(--blk)}
#go svg{width:18px;height:18px}
.top{grid-column:2/-1;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);color:var(--mut);font-size:12px;min-width:0}
.top .b{height:10px;border-radius:5px;background:var(--blk);flex:none}
.list{border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.row{display:flex;gap:10px;align-items:center;height:46px;flex:none}
.row i{width:32px;height:32px;border-radius:50%;background:var(--blk2);flex:none}
.row b{height:9px;border-radius:5px;background:var(--blk)}
.main,.stream{padding:22px 24px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.bub{height:34px;border-radius:10px;background:var(--blk);flex:none}
.bub.r{align-self:flex-end;background:var(--blk2)}
.stage{margin:12px 16px 0;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;align-items:flex-end;padding:12px 14px;color:var(--mut);font-size:12px}
.input{margin:10px 16px 16px;border-radius:12px;background:var(--blk)}
#back{appearance:none;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
#back:hover{background:var(--blk)}
#c,#gl{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;transition:opacity .25s}
#c{z-index:5}
#gl{z-index:6;visibility:hidden}
body.run #c{pointer-events:auto}
#note{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:7;display:flex;gap:6px;align-items:center;padding:5px 6px 5px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--mut);font-size:12px;white-space:nowrap;transition:opacity .2s}
#note button{appearance:none;border:0;background:var(--blk);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;cursor:pointer}
#note button:hover{background:var(--blk2)}
body.run #note{opacity:0;pointer-events:none}
@media(max-width:700px){#before{grid-template-columns:56px minmax(0,1fr)}.list{display:none}}
</style>
</head>
<body>
<div id="before" class="screen">
  <nav class="rail">
    <i class="on"></i><i></i>
    <button id="go" type="button" title="酒馆"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12l-1.4 7.2a4.7 4.7 0 0 1-9.2 0L6 4zM12 15v5M8.5 20h7"/></svg>酒馆</button>
    <i></i>
  </nav>
  <header class="top"><span>工作台（示意）</span><span class="b" style="width:160px"></span></header>
  <aside class="list" id="rows"></aside>
  <main class="main" id="bubA"></main>
</div>
<div id="after" class="screen">
  <nav class="rail"><i></i><i></i><i class="on"></i><i></i></nav>
  <header class="top"><button id="back" type="button">返回</button><span>酒馆（示意）</span></header>
  <section class="stage">角色舞台的位置</section>
  <section class="stream" id="bubB"></section>
  <footer class="input"></footer>
</div>
<canvas id="c" aria-hidden="true"></canvas>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="note"><span>原型 · 两个界面都是示意</span><button id="bTone" type="button">深色 / 浅色</button><button id="bLen" type="button"></button></div>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const cv = $('c'), glcv = $('gl');
const hooks = { onCommit() { document.body.classList.add('in'); }, onDone(reason) { document.body.classList.remove('run'); if (reason !== 'cancelled') { short = true; label(); } } };
// ───────────────────────── 基础工具 ─────────────────────────
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mod = (a, n) => ((a % n) + n) % n;
const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function mulberry32(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function h2(x, y) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; }
const GX = [1, -1, 1, -1, 1, -1, 0, 0], GY = [1, 1, -1, -1, 0, 0, 1, -1];
// 梯度噪声，x 方向以整数 px 为周期，长卷首尾因此无缝
function pn(x, y, px) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const x0 = ((xi % px) + px) % px, x1 = x0 + 1 === px ? 0 : x0 + 1, y1 = yi + 1;
  const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10), v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
  const a = h2(x0, yi) & 7, b = h2(x1, yi) & 7, c = h2(x0, y1) & 7, d = h2(x1, y1) & 7;
  const n00 = GX[a] * xf + GY[a] * yf, n10 = GX[b] * (xf - 1) + GY[b] * yf;
  const n01 = GX[c] * xf + GY[c] * (yf - 1), n11 = GX[d] * (xf - 1) + GY[d] * (yf - 1);
  const nx0 = n00 + (n10 - n00) * u, nx1 = n01 + (n11 - n01) * u;
  return nx0 + (nx1 - nx0) * v;
}

// ───────────────────────── 配色 ─────────────────────────
const PAL = [{ // 玄墨·暗春
  sky0: '#0A0D12', sky1: '#10171F', sky2: '#131B24',
  glow: ['rgba(244,247,245,.085)', 'rgba(244,211,94,.07)'], glow0: ['rgba(244,247,245,0)', 'rgba(244,211,94,0)'],
  water: [11, 17, 24], mist: [205, 219, 224], mistA: .27,
  ink: '5,7,10', cunS: '142,184,190', gold: '244,211,94', goldA: .85, dots: ['5,7,10', '82,183,136', '255,143,163'],
  seamL: '255,226,130', seamC: '255,246,214', vig: '2,4,8', vigA: .5, tint: 'rgba(19,34,52,.07)', hair: '244,247,245', shoreA: .42,
  g0: hex('#1E5C50'), g1: hex('#52B788'), G1: hex('#74C69D'), Gd: hex('#17463F'), P1: hex('#F26D85'), P2: hex('#FF8FA3'),
  Y1: hex('#F4D35E'), Y2: hex('#FFE17D'), Wt: hex('#F4F7F5'), sh0: hex('#0D2331'), sh1: hex('#1B414D'),
  paper: hex('#131B24'), haze: hex('#16232E'), far0: hex('#1A2A36'), far1: hex('#294350')
}, { // 素绢·明春
  sky0: '#EAE4D7', sky1: '#E2DBCB', sky2: '#DCD3C1',
  glow: ['rgba(250,248,245,.55)', 'rgba(233,196,106,.16)'], glow0: ['rgba(250,248,245,0)', 'rgba(233,196,106,0)'],
  water: [199, 202, 188], mist: [250, 248, 245], mistA: .8,
  ink: '30,36,43', cunS: '30,36,43', gold: '196,150,62', goldA: .35, dots: ['30,36,43', '64,145,108', '227,93,117'],
  seamL: '226,178,84', seamC: '176,120,40', vig: '92,74,50', vigA: .24, tint: 'rgba(214,190,150,.06)', hair: '250,248,245', shoreA: .9,
  g0: hex('#40916C'), g1: hex('#74C69D'), G1: hex('#A9DBBF'), Gd: hex('#2E6E58'), P1: hex('#E35D75'), P2: hex('#F598A8'),
  Y1: hex('#E9C46A'), Y2: hex('#F4D35E'), Wt: hex('#FAF8F5'), sh0: hex('#55767A'), sh1: hex('#7C9A96'),
  paper: hex('#EAE4D7'), haze: hex('#DDD7C8'), far0: hex('#BFC3B6'), far1: hex('#A9B6AC')
}];
for (const p of PAL) { const mx3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; p.rim = mx3(p.Wt, p.Y2, .35); p.pale = mx3(p.P2, p.Wt, .4); p.cream = mx3(p.Y2, p.Wt, .3); }

// ───────────────────────── 山势（逻辑坐标：一卷 1536 × 320，y=320 为水岸） ─────────────────────────
const U = 1536, RN = U * 2, LH = 320;
const LAY = [
  { k: 0, far: true, par: .15, F: .22, P: 5, seed: 3.1, hi: 58, lo: 230, gam: 1.4, eps: .05, oct: 4, skew: .45, alpha: .62, fade0: 150, fade1: 266, lineW: .55 },
  { k: 1, par: .40, F: .5, P: 3, seed: 8.7, hi: 20, lo: 238, gam: 1.35, eps: .035, oct: 6, skew: .6, alpha: .97, fade0: 214, fade1: 302, PA: 11, slant: .32, fy: 230, rimD: 9, lineW: 1, haze: .1, fk: 110, minCh: 12 },
  { k: 2, par: .60, F: .74, P: 4, seed: 15.3, hi: 98, lo: 268, gam: 1.2, eps: .035, oct: 6, skew: -.55, alpha: .97, fade0: 252, fade1: 316, PA: 13, slant: -.26, fy: 200, rimD: 8, lineW: 1, haze: .05, fk: 110, minCh: 10 },
  { k: 3, par: .80, F: 1, P: 6, seed: 23.9, hi: 184, lo: 300, gam: 1.1, eps: .045, oct: 5, skew: .5, alpha: .95, fade0: 286, fade1: 322, PA: 16, slant: .3, fy: 150, rimD: 6, lineW: .95, haze: 0, fk: 110, minCh: 7 }
];
const MIST = [
  { mist: true, y0: 148, h: 80, F: .34, par: .25, sp: 2.2, seed: 2.1, am: 1, amp: [9, 6, 3], k: 2, bias: .02, th: 58 },
  { mist: true, y0: 204, h: 72, F: .62, par: .5, sp: -1.5, seed: 6.4, am: .9, amp: [8, 5, 3], k: 3, bias: -.05, th: 52 },
  { mist: true, y0: 262, h: 56, F: .86, par: .7, sp: 1.1, seed: 9.9, am: .8, amp: [6, 4, 2], k: 2, bias: .08, th: 40 }
];
const STACK = [LAY[0], MIST[0], LAY[1], MIST[1], LAY[2], MIST[2], LAY[3]];
for (const it of STACK) { it.atlas = [null, null]; it.t0 = 0; }

// 脊状分形（Ridged Multifractal）+ 山群包络 + 偏斜扭曲：主峰、余脉、缓坡不对称
function buildRidge(L) {
  const raw = new Float32Array(RN); let mn = 1e9, mx = -1e9;
  for (let i = 0; i < RN; i++) {
    const x = i / RN;
    const sk = x + L.skew * Math.sin(TAU * (L.P * x + L.seed)) / (TAU * L.P) + .012 * pn(x * 6, L.seed + 3.7, 6);
    const e0 = pn(x * 3 + L.seed, L.seed * 1.31 + .5, 3) * 1.15 + pn(x * 7, L.seed * 2.17 + 9.5, 7) * .5;
    const E = ss(-.38, .42, e0);
    let f = L.P, a = 1, w = 1, sum = 0, nrm = 0;
    for (let o = 0; o < L.oct; o++) {
      const n = pn(sk * f, L.seed * 5.3 + o * 13.7, f) * 1.9;
      let r = 1 - Math.sqrt(n * n + L.eps); if (r < 0) r = 0;
      r = Math.pow(r, 1.5) * w; w = clamp(r * 1.8, 0, 1); sum += r * a; nrm += a; a *= .5; f *= 2;
    }
    const v = E * (.2 + .8 * sum / nrm) + .1 * pn(x * 5, L.seed + 41.5, 5) + .05 * E;
    raw[i] = v; if (v < mn) mn = v; if (v > mx) mx = v;
  }
  const R = new Float32Array(RN);
  for (let i = 0; i < RN; i++) R[i] = L.lo - (L.lo - L.hi) * Math.pow(clamp((raw[i] - mn) / (mx - mn), 0, 1), L.gam);
  // 轻柔一遍，去掉高频锯齿，保留山肩
  const S = new Float32Array(RN);
  for (let i = 0; i < RN; i++) S[i] = (R[(i + RN - 2) % RN] + 2 * R[(i + RN - 1) % RN] + 3 * R[i] + 2 * R[(i + 1) % RN] + R[(i + 2) % RN]) / 9;
  L.R = S;
  L.Ry = new Float32Array(U); L.top = new Int16Array(U); L.sl = new Float32Array(U);
  for (let x = 0; x < U; x++) { L.Ry[x] = S[x * 2]; L.top[x] = Math.max(0, Math.floor(S[x * 2]) - 2); }
  for (let x = 0; x < U; x++) { let s = 0; for (let j = -6; j <= 6; j++) s += S[mod((x + 14 + j) * 2, RN)] - S[mod((x - 14 + j) * 2, RN)]; L.sl[x] = s / 13 / 28; }
}

// 颜料渍：一侧水线锐利并微聚，另一侧向内化开
function stain(v, th) {
  const e = v - th; if (e <= 0) return 0;
  const aa = e < .022 ? e / .022 : 1;
  return aa * (1 - .6 * ss(0, .34, e)) + .3 * aa * (1 - ss(0, .03, e));
}
let cr = 0, cg = 0, cb = 0; const SH = [0, 0, 0];
const ov = (c, a) => { cr += (c[0] - cr) * a; cg += (c[1] - cg) * a; cb += (c[2] - cb) * a; };

// 主峰罩染：域扭曲噪声场 → 岩棱受光 → 多层低透明矿物色叠加 → 飞白与颗粒
function* bakeBody(L) {
  const FW = U, FH = LH, s = L.seed, PA = L.PA, fx = PA / U, Ry = L.Ry, top = L.top, sl = L.sl;
  const N = new Float32Array(FW * FH), WX = new Float32Array(FW * FH), WY = new Float32Array(FW * FH);
  let yMin = FH; for (let x = 0; x < FW; x++) if (top[x] < yMin) yMin = top[x];
  for (let y = yMin; y < FH; y++) {
    const row = y * FW;
    for (let x = 0; x < FW; x++) {
      if (y < top[x]) continue;
      const d = y - Ry[x];
      const wx = pn(x * 8 / U + s, y / 170 + s * 1.7, 8) * 30, wy = pn(x * 8 / U + s + 5.2, y / 170 + s * 2.9 + 11, 8) * 24;
      WX[row + x] = wx; WY[row + x] = wy;
      const a = (x + L.slant * d + wx) * fx, b = (y + wy) / L.fy;
      N[row + x] = pn(a + s * 3.1, b + s, PA) + .42 * pn(a * 2 + s * 1.3, b * 2 + s * 4.4, PA * 2);
    }
    if ((y & 7) === 7) yield;
  }
  const imgs = [new ImageData(FW, FH), new ImageData(FW, FH)];
  for (let y = yMin; y < FH; y++) {
    const row = y * FW;
    for (let x = 0; x < FW; x++) {
      if (y < top[x]) continue;
      const i = row + x, d = y - Ry[x], n = N[i];
      const xl = x ? x - 1 : FW - 1, xr = x === FW - 1 ? 0 : x + 1;
      const nl = y < top[xl] ? n : N[row + xl], nr = y < top[xr] ? n : N[row + xr];
      const sgn = clamp((Math.abs(nl) - Math.abs(nr)) * .5 * L.fk, -1, 1), near = Math.exp(-Math.abs(n) / .13);
      const macro = clamp(-sl[mod(Math.round(x - L.slant * d), FW)] * 2.4, -1, 1);
      const shadow = Math.max(0, -sgn) * near, hl = Math.max(0, sgn) * near, lit = 1 - shadow;
      const qx = x + L.slant * d * .5 + WX[i] * 1.5, qy = y * .45 + d * .55 + WY[i] * 1.5;
      const ax = (x + L.slant * d) * .75;
      const sp = pn(ax + s, y * .2 + s, 1152) + .5 * pn(ax * 2 + s, y * .42 + s * 2, 2304);
      const dt = pn(qx * 38 / U + s * 3, qy / 19 + s * 2, 38);
      const gA = pn(qx * 6 / U + s * 2, qy / 120 + s, 6) + .5 * pn(qx * 12 / U + s, qy / 60 + s * 3, 12) + .13 * dt + .014 * sp;
      const gB = pn(qx * 5 / U + s * 7, qy / 100 + s * 5, 5) + .5 * pn(qx * 10 / U + s * 2, qy / 50 + s * 9, 10) - .12 * dt + .012 * sp;
      const gC = pn(qx * 9 / U + s * 4, qy / 70 + s * 6, 9) + .5 * pn(qx * 18 / U + s * 8, qy / 35 + s * 2, 18) + .1 * dt - .012 * sp;
      const hgt = clamp(1 - d / 150, 0, 1), rim = Math.exp(-Math.max(0, d) / L.rimD);
      const vB = gB + .16 * hgt + .02, vC = gC + .22 * rim;
      const dry = ss(.3, .5, sp) * lit * (1 - ss(0, .1, Math.abs(vB - .12))) * ss(6, 30, d);
      const grain = 1 + ((h2(x, y) & 255) / 255 - .5) * .08;
      const s1 = stain(gA, .06), s2 = stain(-gA, .1), s3 = stain(vB, .12), s4 = stain(vB, .2), s5 = stain(vB, .3);
      const s6 = stain(vC, .2), s7 = stain(-gC + .3 * rim, .22);
      const foot = ss(L.fade0 - 44, L.fade1, y), mP = ss(.12, .34, vB), mY = ss(.2, .42, vC);
      const A = L.alpha * (1 - ss(L.fade0, L.fade1, y + gA * 26));
      for (let t = 0; t < 2; t++) {
        const p = PAL[t], k = clamp(.4 + .9 * gA + .3 * hgt, 0, 1);
        cr = p.g0[0] + (p.g1[0] - p.g0[0]) * k; cg = p.g0[1] + (p.g1[1] - p.g0[1]) * k; cb = p.g0[2] + (p.g1[2] - p.g0[2]) * k;
        ov(p.G1, .26 * s1); ov(p.Gd, .22 * s2);
        ov(p.pale, .8 * mP); ov(p.P1, .45 * s3); ov(p.P2, .3 * s4); ov(p.P1, .16 * s5);
        ov(p.cream, .5 * mY); ov(p.Y1, .3 * s6); ov(p.Wt, .26 * s7);
        ov(p.rim, .55 * rim * (.55 + .45 * Math.max(0, macro)));
        ov(p.rim, .22 * hl * (.4 + .6 * hgt));
        const k2 = clamp(.5 + gA, 0, 1);
        SH[0] = lerp(p.sh0[0], p.sh1[0], k2); SH[1] = lerp(p.sh0[1], p.sh1[1], k2); SH[2] = lerp(p.sh0[2], p.sh1[2], k2);
        ov(SH, (.62 * shadow * (.45 + .55 * hgt) + .2 * Math.max(0, -macro)) * (1 - foot));
        ov(p.paper, .4 * dry);
        ov(p.haze, L.haze + .25 * foot);
        const o = i * 4, D = imgs[t].data;
        D[o] = cr * grain * 255; D[o + 1] = cg * grain * 255; D[o + 2] = cb * grain * 255; D[o + 3] = A * 255;
      }
    }
    if ((y & 7) === 7) yield;
  }
  L.field = imgs.map((im) => { const c = mk(FW, FH); c.getContext('2d').putImageData(im, 0, 0); return c; });
  // 岩棱：追踪噪声零等值线，正是明暗交界最锐的那一线
  const res = []; let act = [];
  for (let y = yMin; y < FH; y++) {
    const row = y * FW, found = [];
    for (let x = 0; x < FW; x++) {
      const xr = x === FW - 1 ? 0 : x + 1;
      if (y < top[x] + 2 || y < top[xr] + 2) continue;
      const a = N[row + x], b = N[row + xr];
      if ((a < 0) !== (b < 0)) found.push(x + a / (a - b));
    }
